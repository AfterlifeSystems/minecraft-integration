services:
  fabric-server:
    build:
      context: .
      dockerfile: Dockerfile.fabric
    ports:
      - "25565:25565"
      - "24454:24454/udp"
      - "24454:24454/tcp"
    environment:
      JAVA_MEMORY: ${JAVA_MEMORY:-2G}
      VOICE_HOST: ${VOICE_HOST:-}
    volumes:
      - fabric-world:/minecraft/world
      - fabric-config:/minecraft/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/25565'"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 90s

  companion:
    build:
      context: .
      dockerfile: Dockerfile.companion
    depends_on:
      fabric-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MINECRAFT_SERVER_HOST: fabric-server
      MINECRAFT_SERVER_PORT: "25565"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  fabric-world:
  fabric-config:
